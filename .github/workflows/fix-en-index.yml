name: Fix EN index filename

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename English index file
        run: |
          if [ -f en/index.thml ] && [ ! -f en/index.html ]; then
            mv en/index.thml en/index.html
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('en/index.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace('"inLanguage": "ru-RU"','"inLanguage": "en-US"')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix English service page index"
          git push
